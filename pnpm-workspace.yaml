# pnpm 11+ fails the install on any dependency build script not listed here.
allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  # @prisma/config pins effect 3.20.0 (GHSA-7589-6fvf-x4pw, fixed in 3.22.1).
  # Stops applying once Prisma depends on a fixed version.
  'effect@<3.22.1': 3.22.5
