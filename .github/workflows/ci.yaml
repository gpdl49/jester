name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer PR run replaces an older one; on main a newer run waits, so a
# publish already pushing is never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jester_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      # The database name must contain "test": the suite wipes it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jester_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # GitHub-hosted: the repo is public, so its minutes are free, and the
    # self-hosted runners must never serve a public repo (a fork PR could
    # retarget them). Builds with the runner's own Docker: quay.io deletes old
    # buildah digests, so a pinned build container stops resolving.
    env:
      IMAGE: ghcr.io/gpdl49/jester
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      # No provenance: it would turn each tag into an image index.
      - name: Build image
        run: |
          docker build \
            --provenance=false \
            --file Dockerfile \
            --tag "$IMAGE:main" \
            --tag "$IMAGE:main-$GITHUB_SHA" \
            .

      - name: Push image
        run: |
          for tag in "$IMAGE:main" "$IMAGE:main-$GITHUB_SHA"; do
            docker push "$tag"
          done
